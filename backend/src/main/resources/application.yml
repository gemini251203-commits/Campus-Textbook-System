server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: campus-textbook-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:demo}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:campus-textbook-system-secret-key-2026-secure-hmac-sha256-token}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    root: info
    com.school.textbook: info

---
# 默认轻量化演示环境 (demo / h2)：内置 H2 数据库 (MySQL 兼容模式)，启动自动初始化表结构与演示数据
spring:
  config:
    activate:
      on-profile: demo,h2
  datasource:
    driver-class-name: org.h2.Driver
    url: ${H2_JDBC_URL:jdbc:h2:mem:textbook_system;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8

---
# 传统生产数据库环境 (mysql)：连接外部 MySQL 8.0 实例
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/textbook_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8
